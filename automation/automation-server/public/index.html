<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mary's AI: teach it your workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: Workbench (form left, live run rail right) · genre: modern-minimal · theme: Cobalt-tuned
 * tone: utilitarian · anchor hue: cobalt 262 · nav: none (single-task tool) · footer: none
 * pre-emit critique: P4 H4 E4 S4 R5 V4 */
:root{
  --color-paper: oklch(98.5% 0.004 262); --color-surface: oklch(100% 0 0); --color-ink: oklch(22% 0.02 262);
  --color-ink-2: oklch(45% 0.02 262); --color-rule: oklch(90% 0.01 262); --color-rule-2: oklch(84% 0.012 262);
  --color-accent: oklch(52% 0.19 262); --color-accent-hover: oklch(46% 0.19 262); --color-accent-wash: oklch(95% 0.03 262);
  --color-ok: oklch(56% 0.14 150); --color-ok-wash: oklch(95.5% 0.04 150); --color-run: oklch(72% 0.15 75); --color-bad: oklch(55% 0.19 27);
  --color-focus: oklch(60% 0.2 262);
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px; --space-2xl: 48px;
  --text-sm: 13px; --text-base: 15px; --text-lg: 17px; --text-display: clamp(30px, 4.2vw, 46px);
  --radius-sm: 6px; --radius-md: 10px; --ease-out: cubic-bezier(.2,.7,.2,1); --dur-fast: 140ms;
}
*{box-sizing:border-box} html,body{overflow-x:clip}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font:400 var(--text-base)/1.5 var(--font-body)}
.wrap{max-width:1240px;margin:0 auto;padding:var(--space-2xl) var(--space-lg) var(--space-2xl)}
.head{max-width:760px;margin-bottom:var(--space-xl)}
.kicker{font:500 var(--text-sm)/1 var(--font-mono);color:var(--color-accent);margin-bottom:var(--space-sm)}
h1{font:700 var(--text-display)/1.05 var(--font-display);letter-spacing:-.02em;margin:0 0 var(--space-sm);overflow-wrap:anywhere}
.sub{color:var(--color-ink-2);font-size:var(--text-lg);max-width:62ch}
.bench{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--space-xl);align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--color-surface);border:1px solid var(--color-rule);border-radius:var(--radius-md);padding:var(--space-lg)}
form.card{position:sticky;top:var(--space-lg)}
@media (max-width:900px){form.card{position:static}}
label{display:block;font-weight:600;margin:var(--space-md) 0 var(--space-xs)} form label:first-child{margin-top:0}
.hint{color:var(--color-ink-2);font-size:var(--text-sm);font-weight:400}
input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--color-rule-2);border-radius:var(--radius-sm);font:inherit;color:inherit;background:var(--color-surface)}
input[type=text]:hover,textarea:hover{border-color:var(--color-ink-2)}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.pdfs label:has(input:focus-visible){outline:2px solid var(--color-focus);outline-offset:2px}
.file{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;padding:var(--space-xs) 0;color:var(--color-ink-2);font-size:var(--text-sm)}
.file span{min-width:128px;color:var(--color-ink);font-weight:500;font-size:var(--text-base)}
input[type=file]{font:inherit;font-size:var(--text-sm);max-width:100%}
input[type=file]::file-selector-button{font:500 var(--text-sm) var(--font-body);padding:6px 12px;margin-right:var(--space-sm);border:1px solid var(--color-rule-2);border-radius:var(--radius-sm);background:var(--color-paper);color:var(--color-ink);cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--color-ink-2)}
.pdfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:var(--space-xs)}
.pdfs label{margin:0;display:flex;align-items:center;gap:var(--space-xs);font:400 var(--text-sm)/1.2 var(--font-mono);padding:8px 10px;border:1px solid var(--color-rule);border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;background:var(--color-surface);transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.pdfs label:hover{border-color:var(--color-rule-2)}
.pdfs label:has(input:checked){background:var(--color-accent-wash);border-color:var(--color-accent);color:var(--color-ink)}
.pdfs input{accent-color:var(--color-accent);margin:0}
.samples summary{cursor:pointer;font-size:var(--text-sm);color:var(--color-ink);margin-bottom:var(--space-xs)} .samples summary:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.actions{display:flex;align-items:center;gap:var(--space-md);flex-wrap:wrap;margin-top:var(--space-lg)}
button,.btn{font:600 var(--text-base)/1 var(--font-body);padding:12px 20px;border-radius:var(--radius-sm);border:1px solid var(--color-accent);background:var(--color-accent);color:oklch(100% 0 0);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;transition:background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
button:hover,.btn:hover{background:var(--color-accent-hover)} button:active,.btn:active{transform:translateY(1px)}
button:disabled{background:var(--color-rule-2);border-color:var(--color-rule-2);color:var(--color-ink-2);cursor:progress}
.goal{background:var(--color-accent-wash);border-radius:var(--radius-sm);padding:var(--space-sm) var(--space-md);margin:0 0 var(--space-lg);display:none;max-width:760px}
/* run rail */
#steps{position:relative;counter-reset:step}
#steps::before{content:"";position:absolute;left:15px;top:20px;bottom:20px;width:2px;background:var(--color-rule)}
.step{position:relative;margin:0 0 var(--space-md) 0;padding:var(--space-md) var(--space-lg) var(--space-md) 52px;background:transparent;border:1px solid transparent;border-radius:var(--radius-md);counter-increment:step;transition:background var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.step::before{content:counter(step);position:absolute;left:3px;top:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 var(--text-sm)/1 var(--font-mono);background:var(--color-paper);border:2px solid var(--color-rule-2);color:var(--color-ink-2)}
.step h3{margin:0;font:600 var(--text-lg)/1.3 var(--font-display);display:flex;align-items:baseline;gap:var(--space-sm);flex-wrap:wrap;color:var(--color-ink-2)}
.st{font:500 var(--text-sm)/1.3 var(--font-mono);color:var(--color-ink-2)}
.step.run,.step.ok,.step.bad{background:var(--color-surface);border-color:var(--color-rule)}
.step.run h3,.step.ok h3,.step.bad h3{color:var(--color-ink)}
.step.run::before{border-color:var(--color-run);color:var(--color-ink)} .step.run .st{color:oklch(50% 0.12 75)}
.step.ok::before{content:"✓";background:var(--color-ok);border-color:var(--color-ok);color:oklch(100% 0 0)} .step.ok .st{color:var(--color-ok)}
.step.bad::before{content:"!";background:var(--color-bad);border-color:var(--color-bad);color:oklch(100% 0 0)} .step.bad .st{color:var(--color-bad)}
.body{font-size:var(--text-base);color:var(--color-ink)} .body:not(:empty){margin-top:var(--space-sm)} .body p{margin:var(--space-xs) 0}
.body ul{margin:var(--space-xs) 0;padding-left:20px} .body li{margin:2px 0}
.tag{display:inline-block;background:var(--color-accent-wash);color:var(--color-accent-hover);border-radius:999px;padding:2px 10px;font:500 12px/1.5 var(--font-mono)}
.body a{color:var(--color-accent);text-underline-offset:3px}
iframe{width:100%;height:min(760px,80vh);border:1px solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-surface);margin-top:var(--space-sm)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
@media (max-width:480px){.wrap{padding:var(--space-lg) var(--space-md)} .card{padding:var(--space-md)} .step{padding:var(--space-md) var(--space-md) var(--space-md) 48px}}
</style>
<div class="wrap">
<header class="head">
<div class="kicker">Workflow automation · show it once</div>
<h1>Teach your AI your morning routine</h1>
<div class="sub">Give us the tool you use and show us the workflow once. We run it, check every step, and hand you something to take with you.</div>
</header>
<div class="goal" id="goalBox"></div>
<main class="bench">
<form class="card" id="f">
  <label for="url">Your tool's URL</label><input type="text" id="url" value="https://demo.openemr.io/a/openemr">
  <label>Show us your workflow <span class="hint">(a screen recording, and/or a Chrome Recorder JSON)</span></label>
  <div class="file"><span>Screen recording</span><input type="file" id="video" accept="video/*" aria-label="Screen recording"></div>
  <div class="file"><span>Chrome Recorder</span><input type="file" id="rec" accept=".json,application/json" aria-label="Chrome Recorder JSON"></div>
  <label for="goal">Your goal <span class="hint">(optional)</span></label><textarea id="goal" rows="2" placeholder="e.g. Every morning I enter new patients from the fax pile and book their first visit"></textarea>
  <label>What should it work through? <span class="hint">(the documents or records your workflow starts from)</span></label>
  <details class="samples" open><summary><span id="sampleLabel">Sample inputs for this app</span> <span class="hint">· pick which to run</span></summary><div class="pdfs" id="pdfs"></div></details>
  <div class="actions"><button id="go" type="submit">Run it</button><span class="hint" id="siteNote"></span></div>
</form>
<section id="steps" aria-live="polite"></section>
</main>
</div>

<script>
const API = location.origin;
const q = new URLSearchParams(location.search);
const SITE = q.get('site') || 'a';            // public default a; ?site=main for testing
const SUFFIX = q.get('suffix') || '';         // testing only: tags last names so repeated runs don't collide
const SAVED = ['Log in to OpenEMR', 'Register the patient (Patient > New/Search): name, DOB, sex, contact details', 'Book a New Patient appointment on the next weekday',
  'Enter the insurance from the referral (Relationship = Self, carrier, member ID, group)', 'Attach the referral PDF to the patient\'s Documents (Medical Record)'];
const pdfBox = document.getElementById('pdfs');
for (let i = 1; i <= 10; i++) { const n = `referral-${String(i).padStart(2, '0')}.pdf`; pdfBox.insertAdjacentHTML('beforeend', `<label title="${n}"><input type="checkbox" value="${n}" ${i <= 3 ? 'checked' : ''}> ${n}</label>`); }
const urlIn = document.getElementById('url'); const showHost = () => { let h = ''; try { h = new URL(urlIn.value).hostname; } catch {} document.getElementById('sampleLabel').textContent = h ? `Sample inputs for ${h} (referral faxes)` : 'Sample inputs for this app'; }; urlIn.addEventListener('input', showHost); showHost();
if (SITE !== 'a' || SUFFIX) document.getElementById('siteNote').textContent = `test mode: site=${SITE}${SUFFIX ? ', suffix=' + SUFFIX : ''}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const steps = [['understand', 'Understand the workflow'], ['login', 'Log in'], ['run', 'Run it'], ['confirm', 'Confirm'], ['take', 'Take it with you']];
document.getElementById('steps').innerHTML = steps.map(([k, t]) => `<div class="card step" id="s-${k}"><h3>${t}<span class="st">waiting</span></h3><div class="body"></div></div>`).join('');
const set = (k, cls, st, html) => { const e = document.getElementById('s-' + k); e.className = 'card step ' + cls; e.querySelector('.st').textContent = st; if (html !== undefined) e.querySelector('.body').innerHTML = html; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const j = async (u, o) => { const r = await fetch(API + u, o); let b = {}; try { b = await r.json(); } catch {} return { code: r.status, b }; };

document.getElementById('f').onsubmit = async e => {
  e.preventDefault(); document.getElementById('go').disabled = true;
  const goal = document.getElementById('goal').value.trim();
  const gb = document.getElementById('goalBox'); if (goal) { gb.style.display = 'block'; gb.innerHTML = `<b>Your goal:</b> ${esc(goal)}`; }
  const pdfs = [...pdfBox.querySelectorAll('input:checked')].map(i => i.value);
  const video = document.getElementById('video').files[0], rec = document.getElementById('rec').files[0];
  // 1. Understand
  set('understand', 'run', 'working…');
  let wf = '';
  if (rec) {
    const r = await j('/workflow/from-recording', { method: 'POST', headers: { 'content-type': 'application/json' }, body: await rec.text() });
    if (r.code === 200 && r.b.bullets) wf = `<span class="tag">from your recording: ${esc(rec.name)}</span><ul>${r.b.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
    else wf = `<p>Could not read the recording ${esc(rec.name)}: ${esc(r.b.error || 'HTTP ' + r.code)}</p>`;
  }
  if (video) wf += `<p>Video received: ${esc(video.name)}.</p>`;
  if (!rec) wf += `<p>Workflow <span class="tag">from our saved workflow for this app</span></p><ul>${SAVED.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
  set('understand', 'ok', 'done', wf);
  // 2. Log in
  set('login', 'run', 'checking your login…');
  let s = await j(`/status?site=${SITE}`);
  if (s.b.status !== 'LOGGED_IN') {
    set('login', 'run', 'a login window has opened; log in there', '<p>Log in with your own username and password in the window that just opened. We never see or store your password; only the session is kept.</p>');
    const l = await j('/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ site: SITE }) });
    if (l.code !== 200 || l.b.status !== 'LOGGED_IN') { set('login', 'bad', 'not logged in', `<p>${esc(l.b.error || 'HTTP ' + l.code)}. Click Run it again to retry.</p>`); document.getElementById('go').disabled = false; return; }
    s = l;
  }
  set('login', 'ok', 'logged in', `<p>Logged in to ${esc(s.b.site_url || SITE)}.</p>`);
  // 3. Run
  set('run', 'run', 'starting…', `<p>Processing ${pdfs.length} item(s): ${pdfs.map(esc).join(', ')}. Watch the browser window; each step is read back from OpenEMR after it is written.</p>`);
  const body = { site: SITE, headed: true, async: true, pdfs }; if (SUFFIX) body.suffix = SUFFIX;
  const st = await j('/intake', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (st.code !== 202 && st.code !== 200) { set('run', 'bad', 'could not start', `<p>${esc(st.b.error || 'HTTP ' + st.code)}</p>`); document.getElementById('go').disabled = false; return; }
  const t0 = Date.now();
  while (true) { await sleep(3000); const h = await j('/health'); set('run', 'run', `running… ${Math.round((Date.now() - t0) / 1000)}s`); if (!h.b.busy) break; }
  const it = await j('/intake/latest');
  const ok = it.b.intake_id === st.b.intake_id;
  set('run', ok ? 'ok' : 'bad', ok ? it.b.summary : 'finished, but no result found',
    ok ? `<ul>${(it.b.referrals || []).map(r => `<li><b>${esc(r.status)}</b> ${esc(r.file)}: ${esc((r.cli && r.cli.patient && r.cli.patient.last) || '')}${r.seconds ? ' · ' + r.seconds + 's' : ''}${r.reason ? ' · ' + esc(r.reason) : ''}</li>`).join('')}</ul>` : '');
  // 4. Confirm
  set('confirm', 'ok', 'review each referral', `<p><a href="/review/latest" target="_blank">Open the review page ↗</a>. Check each card and click Looks right or Something's wrong.</p><iframe src="/review/latest"></iframe>`);
  // 5. Take it with you
  set('take', 'ok', 'ready', `<p><a class="btn" href="/skill" download>Download the skill (.zip)</a> Drop it into your AI so it can do this workflow for you.</p>`);
};
</script>
